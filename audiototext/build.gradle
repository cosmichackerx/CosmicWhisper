plugins {
  //  alias(libs.plugins.android.application)
    id("com.android.library")
}

android {
    namespace 'com.app'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 23
        targetSdk 35
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

//        externalNativeBuild {
//            cmake {
//                arguments "-DANDROID_PAGE_SIZE=16384"
//                cppFlags ""
//            }
//        }
//
//        packagingOptions {
//            pickFirst "**/libtensorflowlite_jni.so"
//        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute(module("org.hamcrest:hamcrest-core:1.1")).using(module("junit:junit:4.10"))
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
   // testImplementation libs.junit

   // androidTestImplementation libs.androidx.junit
 //   androidTestImplementation libs.androidx.espresso.core

   // implementation ("org.tensorflow:tensorflow-lite:2.17.0")
    implementation ("org.tensorflow:tensorflow-lite-support:0.5.0")

    ///   implementation 'com.google.ai.edge.litert:litert:2.1.3'
 //   implementation 'com.google.ai.edge.litert:litert-api:1.4.2'
  //  implementation 'com.google.ai.edge.litert:litert-support:1.4.2'
//    implementation 'com.google.ai.edge.litert:litert-metadata:1.4.1'

}